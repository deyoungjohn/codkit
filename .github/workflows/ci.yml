name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  move:
    runs-on: ubuntu-latest
    env:
      SUI_VERSION: testnet-v1.82.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        run: |
          curl -sSfL "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz" | tar xz -C /usr/local/bin ./sui
          sui --version
      - name: Move unit tests
        working-directory: packages/contracts/sui
        run: sui move test < /dev/null
  solana:
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: v4.1.2 # the release avm pairs with Anchor 1.2.1
      ANCHOR_VERSION: 1.2.1
    defaults:
      run:
        working-directory: packages/contracts/solana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            packages/contracts/solana/target
          key: solana-${{ env.SOLANA_VERSION }}-${{ hashFiles('packages/contracts/solana/Cargo.lock', 'packages/contracts/solana/rust-toolchain.toml') }}
      - name: Install Solana CLI and Anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Program keypair (CI only; matches nothing deployed)
        run: |
          mkdir -p target/deploy
          [ -f target/deploy/kit_escrow-keypair.json ] || solana-keygen new --no-bip39-passphrase --silent -o target/deploy/kit_escrow-keypair.json
      - name: Build (SBPF v3) and test with LiteSVM
        run: |
          anchor --version && solana --version
          anchor build --ignore-keys
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
  # Versioning and publishing (Changesets + npm Trusted Publishing). Runs on main only after
  # every test job is green: pending changesets → opens/updates a "Version Packages" PR;
  # merging that PR → publishes the new versions (OIDC, provenance), tags them, creates releases.
  release:
    needs: [test, move, solana]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          create-github-releases: true
          commit-message: Version Packages
          pr-title: Version Packages
