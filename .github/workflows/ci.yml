name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  move:
    runs-on: ubuntu-latest
    env:
      SUI_VERSION: testnet-v1.82.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        run: |
          curl -sSfL "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz" | tar xz -C /usr/local/bin ./sui
          sui --version
      - name: Move unit tests
        working-directory: packages/contracts/sui
        run: sui move test < /dev/null
